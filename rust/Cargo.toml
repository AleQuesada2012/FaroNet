[package]
name = "faronet-edge"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "FaroNet Rust Cloudflare Worker development scaffold"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
hmac = "=0.13.0"
sha2 = "=0.11.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
# Preserve the WASM metadata needed by wasm-bindgen.
opt-level = "s"
lto = true
codegen-units = 1
