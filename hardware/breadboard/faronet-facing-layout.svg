<svg xmlns="http://www.w3.org/2000/svg" class="face-view" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Dos Faros enfrentados con rutas ópticas alineadas"><style>.face-view text{font-family:system-ui,sans-serif;fill:#213f56}.face-view .face-title{font-size:28px;font-weight:750}.face-view .face-label{font-size:24px;font-weight:700}.face-view .face-note{font-size:20px}.face-view .face-small{font-size:18px}</style><rect width="1600" height="620" rx="15" fill="#f3f8fa"/>
<text x="60" y="48" class="face-title">Dos Faros enfrentados · vista desde arriba</text><text x="60" y="88" class="face-note">Construir ambos con las lentes al este del plano individual. Después, girar todo el Faro B 180°.</text>
<text x="70" y="144" class="face-label">Faro A · orientación del plano</text><text x="1100" y="144" class="face-label">Faro B · girado 180°</text>
